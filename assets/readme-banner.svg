<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="t d"><title id="t">NetMeter</title><desc id="d">A live network signal graph with animated throughput bars.</desc><defs><linearGradient id="bg"><stop stop-color="#152c3d"/><stop offset="1" stop-color="#09111d"/></linearGradient></defs><rect width="1200" height="300" rx="24" fill="url(#bg)"/><g stroke="#2d465c" stroke-width="1"><path d="M100 90H1100M100 145H1100M100 200H1100M100 255H1100"/></g><path d="M100 210L180 190L260 205L340 120L420 150L500 95L580 140L660 105L740 170L820 115L900 145L980 90L1100 115" fill="none" stroke="#62e3c1" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="1200" stroke-dashoffset="1200"><animate attributeName="stroke-dashoffset" values="1200;0;0" dur="5s" repeatCount="indefinite"/></path><g fill="#8fa8ff"><circle cx="500" cy="95" r="6"><animate attributeName="r" values="4;9;4" dur="2s" repeatCount="indefinite"/></circle><circle cx="980" cy="90" r="6"/></g><text x="58" y="48" fill="#edf3ff" font-family="Arial,sans-serif" font-size="23" font-weight="700" letter-spacing="5">NETMETER</text><text x="1140" y="48" text-anchor="end" fill="#91a0ba" font-family="monospace" font-size="13" letter-spacing="3">LATENCY / DOWNLOAD / UPLOAD</text></svg>